name: Publicar actualización de Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        shell: pwsh
        run: npm ci

      - name: Validar seguridad y pruebas
        shell: pwsh
        run: |
          npm audit --audit-level=moderate
          npm test

      - name: Construir aplicación Electron
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          npm pkg set version=$version
          npm run build

      - name: Crear instalador NSIS
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          npm exec electron-builder -- --win nsis --publish never
          $installer = "release\CordonDeOro-Setup-$version.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          "$hash  CordonDeOro-Setup-$version.exe" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" `
            "release\CordonDeOro-Setup-$version.exe" `
            "release\CordonDeOro-Setup-$version.exe.blockmap" `
            "release\CordonDeOro-Setup-$version.exe.sha256" `
            "release\latest.yml" `
            --generate-notes --title "Cordón de Oro $version"

